name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion. Defaults to the GitHub run number."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/app-store-upload-trigger"

permissions:
  contents: read

env:
  PROJECT_PATH: NHS CareerCoach AI.xcodeproj
  SCHEME: NHS CareerCoach AI
  APP_IDENTIFIER: com.nhscareercoach.app
  MARKETING_VERSION: "1.0"

jobs:
  archive-and-upload:
    name: Archive and upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if compgen -G "/Applications/Xcode_26*.app" > /dev/null; then
            XCODE_PATH="$(ls -d /Applications/Xcode_26*.app | sort | tail -n 1)"
          elif [ -d "/Applications/Xcode.app" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          else
            XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort | tail -n 1)"
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode / { split($2, version, "."); print version[1] }')"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::App Store Connect currently requires the iOS 26 SDK. This runner selected Xcode $XCODE_MAJOR."
            exit 1
          fi

      - name: Prepare build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using build number $BUILD_NUMBER"

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_PRIVATE_KEY" ]; then
            echo "Missing APP_STORE_CONNECT_API_KEY_ID or APP_STORE_CONNECT_API_PRIVATE_KEY secret."
            exit 1
          fi

          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$ASC_KEY_DIR"
          if echo "$ASC_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_API_PRIVATE_KEY" > "$ASC_KEY_PATH"
          else
            printf '%s' "$ASC_API_PRIVATE_KEY" | base64 --decode > "$ASC_KEY_PATH"
          fi
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive release build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ]; then
            echo "Missing APPLE_TEAM_ID, APP_STORE_CONNECT_API_KEY_ID, or APP_STORE_CONNECT_API_ISSUER_ID secret."
            exit 1
          fi

          ARCHIVE_PATH="$RUNNER_TEMP/NHSCareerCoachAI.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_IDENTIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Upload archive to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_API_ISSUER_ID" ]; then
            echo "Missing APPLE_TEAM_ID or APP_STORE_CONNECT_API_ISSUER_ID secret."
            exit 1
          fi

          EXPORT_PATH="$RUNNER_TEMP/AppStoreExport"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>upload</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Attach uploaded build to App Store version
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          exp="$((now + 1200))"
          header="$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_API_KEY_ID" | base64url)"
          payload="$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ASC_API_ISSUER_ID" "$now" "$exp" | base64url)"
          signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$ASC_KEY_PATH" -binary | python3 -c 'import base64,sys
data=sys.stdin.buffer.read()
if data[0] != 0x30:
    raise SystemExit("Unexpected ECDSA signature")
idx = 2
if data[1] & 0x80:
    length_bytes = data[1] & 0x7f
    idx = 2 + length_bytes
if data[idx] != 0x02:
    raise SystemExit("Unexpected ECDSA r marker")
r_len = data[idx + 1]
r = data[idx + 2:idx + 2 + r_len].lstrip(b"\x00").rjust(32, b"\x00")
idx = idx + 2 + r_len
if data[idx] != 0x02:
    raise SystemExit("Unexpected ECDSA s marker")
s_len = data[idx + 1]
s = data[idx + 2:idx + 2 + s_len].lstrip(b"\x00").rjust(32, b"\x00")
print(base64.urlsafe_b64encode(r + s).rstrip(b"=").decode())')"
          token="$header.$payload.$signature"
          api_base="https://api.appstoreconnect.apple.com/v1"

          api_get() {
            curl -gfsS -H "Authorization: Bearer $token" "$api_base/$1"
          }

          api_patch() {
            local path="$1"
            local body="$2"
            curl -gfsS \
              -X PATCH \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$api_base/$path"
          }

          app_id="$(api_get "apps?filter[bundleId]=$APP_IDENTIFIER&limit=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"][0]["id"])')"
          version_id="$(api_get "apps/$app_id/appStoreVersions?filter[platform]=IOS&filter[versionString]=$MARKETING_VERSION&limit=10" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"][0]["id"])')"

          build_id=""
          processing_state=""
          for attempt in $(seq 1 30); do
            response="$(api_get "builds?filter[app]=$app_id&filter[version]=$BUILD_NUMBER&limit=10")"
            build_id="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; print(data[0]["id"] if data else "")')"
            processing_state="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; print(data[0].get("attributes", {}).get("processingState", "") if data else "")')"
            if [ -n "$build_id" ] && [ "$processing_state" = "VALID" ]; then
              break
            fi
            echo "Waiting for build $BUILD_NUMBER to become VALID in App Store Connect (attempt $attempt/30, state: ${processing_state:-not found})"
            sleep 20
          done

          if [ -z "$build_id" ] || [ "$processing_state" != "VALID" ]; then
            echo "::error::Build $BUILD_NUMBER was not ready to attach. Last state: ${processing_state:-not found}"
            exit 1
          fi

          api_patch "appStoreVersions/$version_id/relationships/build" \
            "{\"data\":{\"type\":\"builds\",\"id\":\"$build_id\"}}"

          review_id="$(api_get "appStoreVersions/$version_id/appStoreReviewDetail" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"
          review_notes="NHS CareerCoach AI is an independent educational career support app for NHS and UK healthcare job applicants. It is not affiliated with the NHS and does not guarantee interviews, offers, progression or employment outcomes. No sign-in is required. App Review update for this build: Job Scanner actions now respond on iPad. Analyze processes entered advert text or a sample NHS advert if the field is empty. Upload PDF opens document import and records the selected document state. Upload screenshot opens photo selection and records the selected screenshot state. Placeholder and scaffold wording has been removed from the app interface. Suggested review path: complete onboarding, then open Dashboard, Job Scanner, Supporting Statement Builder, Voice Coach, Mock Interview, STAR Builder, Application Tracker, Readiness and Settings."
          notes_body="$(REVIEW_NOTES="$review_notes" REVIEW_ID="$review_id" python3 -c 'import json,os; print(json.dumps({"data":{"type":"appStoreReviewDetails","id":os.environ["REVIEW_ID"],"attributes":{"notes":os.environ["REVIEW_NOTES"],"demoAccountRequired":False}}}))')"
          api_patch "appStoreReviewDetails/$review_id" "$notes_body"

          echo "Attached build $BUILD_NUMBER ($build_id) to App Store version $MARKETING_VERSION and updated App Review notes."
